<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs><rect width="1000" height="230" fill="#ffffff"/><defs><linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="0.5" stop-color="#e5e7eb"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><rect x="60" y="80" width="880" height="30" rx="15" fill="url(#sc)"/><text x="60" y="65" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1e1b4b">0</text><text x="60" y="140" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#6b7280">25%+ above market</text><text x="500" y="65" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1e1b4b">50</text><text x="500" y="140" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#6b7280">at market</text><text x="940" y="65" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1e1b4b">100</text><text x="940" y="140" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#6b7280">25%+ below market</text><text x="500" y="190" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">score = 50 + (1 − asking price per sqm ÷ median sold price per sqm) × 200, clamped to 0–100</text><text x="500" y="214" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-w