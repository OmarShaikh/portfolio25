al gateway</text><text x="805.0" y="269.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">deterministic code, not a prompt</text><line x1="550" y1="170" x2="638" y2="75" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="190" x2="638" y2="165" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="230" x2="638" y2="255" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/><text x="805" y="320" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#b45309">→ nothing leaves without my tap</text><rect x="140" y="390" width="220" height="90" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="250.0" y="427.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">PostgreSQL</text><text x="250.0" y="449.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">system of record</text><text x="250.0" y="467.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">people, money, commitments</text><rect x="390" y="390" width="220" height="90" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="500.0" y="427.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">Semantic memory</text><text x="500.0" y="449.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">Hindsight</text><text x="500.0" y="467.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">meaning, context, links</text><rect x="640" y="390" width="220" height="90" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="750.0" y="427.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">Markdown vault</text><text x="750.0" y="449.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">human-readable view</text><text x="750.0" y="467.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">never the source of truth</text><line x1="420" y1="290" x2="250" y2="388" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/><text x="341.0" y="333.0" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b7280">exact facts</text><line x1="420" y1="290" x2="500" y2="388" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/><text x="466.0" y="333.0" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b7280">texture</text><line x1="420" y1="290" x2="750" y2="388" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/><text x="591.0" y="333.0" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b7280">rendered</text><text x="500" y="530" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#6b7280">Everything runs on one mini-PC at home, reachable only over a private network.</text></svg>