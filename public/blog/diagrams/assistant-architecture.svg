<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs><rect width="1000" height="560" fill="#ffffff"/><rect x="30" y="60" width="170" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="115.0" y="87.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">Telegram</text><text x="115.0" y="109.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">text, voice notes, files</text><rect x="30" y="160" width="170" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="115.0" y="187.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">Email</text><text x="115.0" y="209.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">its own inbox</text><rect x="30" y="260" width="170" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="115.0" y="287.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">Scheduled jobs</text><text x="115.0" y="309.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">briefing, sentinel, scans</text><rect x="290" y="120" width="260" height="170" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/><text x="420.0" y="197.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#1e1b4b">Agent runtime</text><text x="420.0" y="219.0" t